<svg xmlns="http://www.w3.org/2000/svg" width="801" height="244" viewBox="0 0 801 244">
<rect width="100%" height="100%" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect width="100%" height="32" rx="10" fill="#161b22"/><rect y="22" width="100%" height="10" fill="#161b22"/>
<circle cx="18" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="58" cy="16" r="6" fill="#27c93f"/>
<text x="401" y="21" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">ratatoskr — dry run and limits</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">
<text x="14" y="56" fill="#58a6ff">$ python main.py --to Alice --to &quot;Family&quot; &quot;Dinner at 8?\nBring dessert 🍰&quot; --at 19:30 --dry-run</text>
<text x="14" y="74" fill="#e6edf3">would send to &#x27;Alice&#x27; at 2026-11-12 19:30, 1x:</text>
<text x="14" y="92" fill="#e6edf3">  | Dinner at 8?</text>
<text x="14" y="110" fill="#e6edf3">  | Bring dessert 🍰</text>
<text x="14" y="128" fill="#e6edf3">would send to &#x27;Family&#x27; at 2026-11-12 19:30, 1x:</text>
<text x="14" y="146" fill="#e6edf3">  | Dinner at 8?</text>
<text x="14" y="164" fill="#e6edf3">  | Bring dessert 🍰</text>
<text x="14" y="182" fill="#e6edf3"></text>
<text x="14" y="200" fill="#58a6ff">$ python main.py Alice hi -n 50</text>
<text x="14" y="218" fill="#f85149">ratatoskr: error: --repeat must be at least 1 and recipients x repeat at most 20</text>
</g></svg>
